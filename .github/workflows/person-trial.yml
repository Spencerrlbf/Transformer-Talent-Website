name: Person writer trial

# The 50-person trial of the one writer (lib/server/person + save_person,
# migration 072): reads every stored source for the given people, saves them
# into the new tables only and checks the counts. Manual only, never scheduled.
# The log shows ids, counts and check results; never a name, email, phone or
# date (the repository is public, and so are its Actions logs).
# dry_run (ticked by default) saves nothing; only an unticked box saves.
# A run after a translator change needs scripts/person-trial-undo.mjs --apply
# for the same ids first (the run refuses otherwise: sources_current).
# GitHub dispatches only workflows whose file is on the default branch: with
# this file on main, dispatch with --ref <the trial branch> to run its scripts.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Candidate ids, comma separated (not needed for describe)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Read everything and build the docs; save nothing"
        type: boolean
        default: true
      repeat:
        description: "Save everything twice; the second pass must change nothing"
        type: boolean
        default: false
      describe:
        description: "Only print the directory's table and column names the trial reads"
        type: boolean
        default: false
      allow_parser_replay:
        description: "Allow the reviewed person-v2 to person-v3 source replay"
        type: boolean
        default: false
      undo:
        description: "Undo the trial for these ids (scripts/person-trial-undo.mjs); with dry_run ticked it only counts"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: person-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund pg@8
      - run: node scripts/build-worker-lib.mjs
      - if: ${{ !inputs.undo }}
        run: node scripts/person-trial.mjs
        env:
          ALLOW_PARSER_REPLAY: ${{ inputs.allow_parser_replay && '1' || '' }}
          TRIAL_IDS: ${{ inputs.ids }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          REPEAT: ${{ inputs.repeat && '1' || '' }}
          DESCRIBE: ${{ inputs.describe && '1' || '' }}
          COMMS_DATABASE_URL: ${{ secrets.COMMS_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: ${{ inputs.undo }}
        run: node scripts/person-trial-undo.mjs
        env:
          TRIAL_IDS: ${{ inputs.ids }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
