name: Certified embeddings (hourly)

# Writes search chunks for people whose sources changed, within the hour.
# Skipped (no runner) until the repository is on the new path: support on, live.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      write_mode:
        description: "Canary override for this run only: person write mode (vars = repository setting)"
        type: choice
        options: [vars, legacy, shadow, live]
        default: vars
      transition_support:
        description: "Canary override for this run only: transition support (vars = repository setting)"
        type: choice
        options: [vars, "off", "on"]
        default: vars

# One run at a time: the daily cap is read from the database, and overlapping runs
# would each see the same remaining budget. A waiting run is replaced by a newer one.
concurrency:
  group: derivative-worker
  cancel-in-progress: false

jobs:
  embed:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.PERSON_TRANSITION_SUPPORT == 'on' && vars.PERSON_WRITE_MODE == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-worker-lib.mjs
      - run: node scripts/derivative-worker.mjs
        env:
          # Scheduled runs use the repository settings; a manual canary may override them for one run.
          PERSON_WRITE_MODE: ${{ (inputs.write_mode && inputs.write_mode != 'vars') && inputs.write_mode || vars.PERSON_WRITE_MODE || 'legacy' }}
          PERSON_TRANSITION_SUPPORT: ${{ (inputs.transition_support && inputs.transition_support != 'vars') && inputs.transition_support || vars.PERSON_TRANSITION_SUPPORT || 'off' }}
          PERSON_DATABASE_URL: ${{ secrets.PERSON_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DERIVATIVE_DAILY_CAP: ${{ vars.DERIVATIVE_DAILY_CAP || 200 }}
