name: Build role shortlists

on:
  # Run by hand until the first lists have been looked at; the nightly
  # schedule (08:15 UTC, after the signals) comes with the job page tab.
  workflow_dispatch:
    inputs:
      role:
        description: "One role by its job id (blank = every open role with a scorecard)"
        required: false
        default: ""
      limit:
        description: "Stop after this many roles (a bounded test)"
        required: false
        default: ""
      dry_run:
        description: "Compute and print, write nothing"
        type: boolean
        default: false

jobs:
  shortlists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-worker-lib.mjs
      - run: node scripts/build-shortlists.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROLE: ${{ inputs.role }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
