name: Sync engaged candidates from the directory

on:
  schedule:
    # Before the signals (07:30 UTC) and the Harvest refresh (08:00 UTC).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Legacy: full directory instead of recent changes. Normalized modes always resume the full scan."
        type: boolean
        default: false
      dry_run:
        description: "Read everything, write nothing, print what would change"
        type: boolean
        default: false
      limit:
        description: "Stop after this many contacts (a bounded test)"
        required: false
        default: ""
      write_mode:
        description: "Canary override for this run only: person write mode (vars = repository setting)"
        type: choice
        options: [vars, legacy, shadow, live]
        default: vars
      transition_support:
        description: "Canary override for this run only: transition support (vars = repository setting)"
        type: choice
        options: [vars, "off", "on"]
        default: vars

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/build-worker-lib.mjs
      - run: |
          if [ "${{ inputs.full }}" != "true" ]; then
            export SINCE="$(date -u -d '2 days ago' +%Y-%m-%d)"
          fi
          node scripts/sync-directory.mjs
        env:
          # Scheduled runs use the repository settings; a manual canary may override them for one run.
          PERSON_WRITE_MODE: ${{ (inputs.write_mode && inputs.write_mode != 'vars') && inputs.write_mode || vars.PERSON_WRITE_MODE || 'legacy' }}
          PERSON_TRANSITION_SUPPORT: ${{ (inputs.transition_support && inputs.transition_support != 'vars') && inputs.transition_support || vars.PERSON_TRANSITION_SUPPORT || 'off' }}
          PERSON_DATABASE_URL: ${{ secrets.PERSON_DATABASE_URL }}
          COMMS_DATABASE_URL: ${{ secrets.COMMS_DATABASE_URL }}
          COMMS_WORKSPACE: ${{ vars.COMMS_WORKSPACE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LIMIT: ${{ inputs.limit }}
