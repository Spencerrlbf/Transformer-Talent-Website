name: Refresh candidate pool via Harvest

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      cap:
        description: "Paid Harvest calls allowed today (blank = the nightly cap)"
        required: false
      concurrency:
        description: "Profiles in flight (blank = 1)"
        required: false
      no_topup:
        description: "Drain only what is queued; add no engaged backfill"
        type: boolean
        default: false
      write_mode:
        description: "Canary override for this run only: person write mode (vars = repository setting)"
        type: choice
        options: [vars, legacy, shadow, live]
        default: vars
      transition_support:
        description: "Canary override for this run only: transition support (vars = repository setting)"
        type: choice
        options: [vars, "off", "on"]
        default: vars

# One refresh run at a time: the Harvest spend cap is read from the database, and
# overlapping runs would each see the same remaining budget. Embeddings run in the
# hourly derivative-worker workflow (#82), which has its own group and cap.
concurrency:
  group: refresh-queue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-worker-lib.mjs
      - run: node scripts/refresh-worker.mjs
        env:
          # Scheduled runs use the repository settings; a manual canary may override them for one run.
          PERSON_WRITE_MODE: ${{ (inputs.write_mode && inputs.write_mode != 'vars') && inputs.write_mode || vars.PERSON_WRITE_MODE || 'legacy' }}
          PERSON_TRANSITION_SUPPORT: ${{ (inputs.transition_support && inputs.transition_support != 'vars') && inputs.transition_support || vars.PERSON_TRANSITION_SUPPORT || 'off' }}
          # The one project these writers may touch (scripts/person-target.mjs). Shadow/live
          # work refuses to start when this is unset or names another project than the URLs.
          PERSON_TARGET_PROJECT_REF: ${{ vars.PERSON_TARGET_PROJECT_REF }}
          PERSON_DATABASE_URL: ${{ secrets.PERSON_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HARVEST_API_KEY: ${{ secrets.HARVEST_API_KEY }}
          REFRESH_DAILY_CAP: ${{ inputs.cap || vars.REFRESH_DAILY_CAP || 50 }}
          CONCURRENCY: ${{ inputs.concurrency || '1' }}
          NO_TOPUP: ${{ inputs.no_topup && '1' || '' }}
